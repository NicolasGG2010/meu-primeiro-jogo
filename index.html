<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Clone - Advanced</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #060913;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        h1 {
            color: #00f0ff;
            text-shadow: 0 0 15px #00f0ff;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .painel-status {
            display: flex;
            gap: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .destaque {
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f;
        }

        #jogo {
            display: block;
            width: 95%;
            max-width: 800px;
            border: 3px solid #00f0ff;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            background: #000;
            cursor: pointer;
        }

        .controles {
            margin-top: 15px;
        }

        button {
            padding: 12px 28px;
            margin: 5px;
            border-radius: 8px;
            background: linear-gradient(45deg, #00f0ff, #7000ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            transition: transform 0.1s, filter 0.2s;
        }

        button:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        p {
            margin: 5px 0;
            color: #a0aabf;
        }
    </style>
</head>
<body>

    <h1>GEOMETRY DASH CLONE</h1>
    <div class="painel-status">
        <div>Pontos: <span id="pontos" class="destaque">0</span></div>
        <div>Fase: <span id="fase" class="destaque">1</span></div>
        <div>Recorde: <span id="recorde" class="destaque">0</span></div>
    </div>

    <canvas id="jogo" width="800" height="300"></canvas>

    <div class="controles">
        <button id="botao" onclick="iniciar()">Jogar</button>
        <button onclick="pular()">Pular (Espaço / Clique)</button>
    </div>
    <p>Pressione <b>Espaço</b>, <b>Seta para Cima</b> ou <b>Clique na Tela</b> para pular.</p>

    <script>
        const tela = document.getElementById("jogo");
        const ctx = tela.getContext("2d");
        const elPontos = document.getElementById("pontos");
        const elFase = document.getElementById("fase");
        const elRecorde = document.getElementById("recorde");
        const botao = document.getElementById("botao");

        // Web Audio API para Efeitos Sonoros sem arquivos externos
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function tocarSom(frequencia, tipo, duracao) {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = tipo;
            osc.frequency.setValueAtTime(frequencia, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duracao);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duracao);
        }

        function somPulo() {
            if (!audioCtx) audioCtx = new AudioCtx();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function somMorte() {
            tocarSom(100, "sawtooth", 0.4);
        }

        function somPonto() {
            tocarSom(587.33, "triangle", 0.1); // Nota Re
        }

        // Configurações do Jogo
        let cubo, espinhos, particulas, pontos, fase, velocidade, recorde;
        let jogando = false;
        let terminou = false;
        let frame;
        let pressionado = false;
        let deslocamentoChao = 0;

        // Temas de Cores para as Fases
        const temasFases = [
            { bg: '#080d20', chao: '#00f0ff', espinho: '#ff0055' }, // Fase 1: Neon Blue / Pink
            { bg: '#1a0022', chao: '#ff00d0', espinho: '#00ff66' }, // Fase 2: Cyber Purple
            { bg: '#221000', chao: '#ff9900', espinho: '#00ffff' }, // Fase 3: Orange Neon
            { bg: '#002214', chao: '#00ff88', espinho: '#ff3300' }  // Fase 4: Matrix Green
        ];

        // Carregar Recorde
        recorde = localStorage.getItem("gd_recorde") || 0;
        elRecorde.textContent = recorde;

        function iniciar() {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            cancelAnimationFrame(frame);

            cubo = {
                x: 100,
                y: 220,
                tamanho: 30,
                velocidadeY: 0,
                noChao: true,
                angulo: 0
            };

            espinhos = [
                { x: 600, tamanho: 32 },
                { x: 950, tamanho: 32 }
            ];

            particulas = [];
            pontos = 0;
            fase = 1;
            velocidade = 6;
            jogando = true;
            terminou = false;

            elPontos.textContent = "0";
            elFase.textContent = "1";
            botao.textContent = "Recomeçar";

            desenhar();
        }

        function pular() {
            if (jogando && cubo.noChao) {
                cubo.velocidadeY = -12;
                cubo.noChao = false;
                somPulo();
            }
        }

        // Eventos de Entrada
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                if (!pressionado) {
                    pular();
                    pressionado = true;
                }
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") pressionado = false;
        });

        tela.addEventListener("pointerdown", pular);

        function criarParticula(x, y, cor) {
            particulas.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 4 - 2,
                vy: (Math.random() - 0.5) * 4,
                tamanho: Math.random() * 5 + 2,
                vida: 1,
                cor: cor
            });
        }

        function desenhar() {
            const temaAtual = temasFases[(fase - 1) % temasFases.length];

            // Fundo
            ctx.fillStyle = temaAtual.bg;
            ctx.fillRect(0, 0, 800, 300);

            // Grade de Fundo (Efeito Synthwave)
            ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
            ctx.lineWidth = 1;
            for (let x = 0; x < 800; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 255);
                ctx.stroke();
            }

            // Atualização da Lógica
            if (jogando) {
                // Atualizar Fase
                const novaFase = Math.floor(pontos / 10) + 1;
                if (novaFase !== fase) {
                    fase = novaFase;
                    velocidade += 0.5;
                    elFase.textContent = fase;
                }

                // Física do Cubo
                cubo.velocidadeY += 0.65;
                cubo.y += cubo.velocidadeY;

                if (!cubo.noChao) {
                    cubo.angulo += 0.15; // Girar no ar
                    // Partículas de rastro
                    criarParticula(cubo.x, cubo.y + cubo.tamanho / 2, temaAtual.chao);
                } else {
                    cubo.angulo = 0; // Alinhar no chão
                }

                if (cubo.y + cubo.tamanho >= 255) {
                    cubo.y = 255 - cubo.tamanho;
                    cubo.velocidadeY = 0;
                    cubo.noChao = true;
                }

                // Movimento e Colisão dos Espinhos
                for (const espinho of espinhos) {
                    espinho.x -= velocidade;

                    if (espinho.x + espinho.tamanho < 0) {
                        espinho.x = 800 + Math.random() * 250 + 100;
                        pontos++;
                        elPontos.textContent = pontos;
                        somPonto();

                        if (pontos > recorde) {
                            recorde = pontos;
                            elRecorde.textContent = recorde;
                            localStorage.setItem("gd_recorde", recorde);
                        }
                    }

                    // Colisão com tolerância (hitbox levemente reduzida para gameplay justa)
                    const margem = 4;
                    const bateu =
                        cubo.x + cubo.tamanho - margem > espinho.x &&
                        cubo.x + margem < espinho.x + espinho.tamanho &&
                        cubo.y + cubo.tamanho - margem > 255 - espinho.tamanho;

                    if (bateu) {
                        jogando = false;
                        terminou = true;
                        somMorte();
                        botao.textContent = "Jogar Novamente";
                        
                        // Explosão de Partículas
                        for(let i = 0; i < 30; i++) {
                            criarParticula(cubo.x + 15, cubo.y + 15, "#ff0055");
                        }
                    }
                }

                deslocamentoChao = (deslocamentoChao + velocidade) % 30;
            }

            // Desenhar Chão Neon
            ctx.fillStyle = "#0d111a";
            ctx.fillRect(0, 255, 800, 45);

            ctx.strokeStyle = temaAtual.chao;
            ctx.shadowColor = temaAtual.chao;
            ctx.shadowBlur = 10;
            ctx.lineWidth = 3;

            // Linha do Chão
            ctx.beginPath();
            ctx.moveTo(0, 255);
            ctx.lineTo(800, 255);
            ctx.stroke();

            // Detalhes do Chão em Movimento
            ctx.lineWidth = 1;
            for (let x = -deslocamentoChao; x < 800; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 255);
                ctx.lineTo(x - 15, 300);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // Desenhar Partículas
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vida -= 0.03;

                if (p.vida <= 0) {
                    particulas.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = p.cor;
                ctx.globalAlpha = p.vida;
                ctx.fillRect(p.x, p.y, p.tamanho, p.tamanho);
                ctx.globalAlpha = 1;
            }

            // Desenhar Cubo com Rotação
            ctx.save();
            ctx.translate(cubo.x + cubo.tamanho / 2, cubo.y + cubo.tamanho / 2);
            ctx.rotate(cubo.angulo);
            ctx.fillStyle = temaAtual.chao;
            ctx.shadowColor = temaAtual.chao;
            ctx.shadowBlur = 15;
            ctx.fillRect(-cubo.tamanho / 2, -cubo.tamanho / 2, cubo.tamanho, cubo.tamanho);
            
            // Detalhe Interno do Cubo
            ctx.fillStyle = "#fff";
            ctx.fillRect(-cubo.tamanho / 4, -cubo.tamanho / 4, cubo.tamanho / 2, cubo.tamanho / 2);
            ctx.restore();
            ctx.shadowBlur = 0;

            // Desenhar Espinhos
            ctx.fillStyle = temaAtual.espinho;
            ctx.shadowColor = temaAtual.espinho;
            ctx.shadowBlur = 10;
            for (const espinho of espinhos) {
                ctx.beginPath();
                ctx.moveTo(espinho.x, 255);
                ctx.lineTo(espinho.x + espinho.tamanho / 2, 255 - espinho.tamanho);
                ctx.lineTo(espinho.x + espinho.tamanho, 255);
                ctx.closePath();
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // Loop ou Game Over
            if (jogando) {
                frame = requestAnimationFrame(desenhar);
            } else if (terminou) {
                // Desenhar últimas partículas da explosão
                for (let i = particulas.length - 1; i >= 0; i--) {
                    const p = particulas[i];
                    ctx.fillStyle = p.cor;
                    ctx.globalAlpha = p.vida;
                    ctx.fillRect(p.x, p.y, p.tamanho, p.tamanho);
                    ctx.globalAlpha = 1;
                }

                ctx.fillStyle = "#ffffff";
                ctx.shadowColor = "#ff0055";
                ctx.shadowBlur = 15;
                ctx.font = "900 36px 'Segoe UI', sans-serif";
                ctx.fillText("FIM DE JOGO!", 285, 120);

                ctx.font = "bold 20px 'Segoe UI', sans-serif";
                ctx.fillStyle = "#00f0ff";
                ctx.shadowColor = "#00f0ff";
                ctx.fillText("Pontuação Final: " + pontos, 310, 160);
                ctx.shadowBlur = 0;
            }
        }

        // Desenho da Tela Inicial
        ctx.fillStyle = "#080d20";
        ctx.fillRect(0, 0, 800, 300);
        ctx.fillStyle = "#0d111a";
        ctx.fillRect(0, 255, 800, 45);
        ctx.strokeStyle = "#00f0ff";
        ctx.beginPath();
        ctx.moveTo(0, 255);
        ctx.lineTo(800, 255);
        ctx.stroke();

        ctx.fillStyle = "#00f0ff";
        ctx.shadowColor = "#00f0ff";
        ctx.shadowBlur = 15;
        ctx.fillRect(100, 225, 30, 30);
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#ff0055";
        ctx.shadowColor = "#ff0055";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(600, 255);
        ctx.lineTo(616, 223);
        ctx.lineTo(632, 255);
        ctx.fill();
        ctx.shadowBlur = 0;
    </script>
</body>
</html>
