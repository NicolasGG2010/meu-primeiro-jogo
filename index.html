<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Jogo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080d20;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #36e8ff;
            text-shadow: 0 0 15px #0087ff;
        }

        #jogo {
            display: block;
            width: 95%;
            max-width: 800px;
            margin: 20px auto;
            border: 2px solid #36e8ff;
            border-radius: 12px;
            background: #101a39;
        }

        button {
            padding: 13px 24px;
            margin: 5px;
            border-radius: 9px;
            background: #36e8ff;
            color: #081126;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #7ae8ff;
        }

        p {
            padding: 0 12px;
        }
    </style>
</head>

<body>
    <h1>MEU PRIMEIRO JOGO</h1>
    <p>Desvie dos espinhos e tente chegar mais longe!</p>

    <canvas id="jogo" width="800" height="300"></canvas>

    <p id="informacao">Clique em Jogar para começar.</p>
    <button id="botao" onclick="iniciar()">Jogar</button>
    <button onclick="pular()">Pular</button>

    <script>
        const tela = document.getElementById("jogo");
        const ctx = tela.getContext("2d");
        const informacao = document.getElementById("informacao");
        const botao = document.getElementById("botao");

        let cubo, espinhos, pontos, velocidade;
        let jogando = false;
        let terminou = false;
        let frame;
        let pressionado = false;

        function iniciar() {
            cancelAnimationFrame(frame);

            cubo = {
                x: 100,
                y: 220,
                tamanho: 30,
                velocidadeY: 0,
                noChao: true
            };

            espinhos = [
                { x: 500, tamanho: 32 },
                { x: 800, tamanho: 32 }
            ];

            pontos = 0;
            velocidade = 5;
            jogando = true;
            terminou = false;

            botao.textContent = "Recomeçar";
            informacao.textContent = "Pontos: 0";
            desenhar();
        }

        function pular() {
            if (jogando && cubo.noChao) {
                cubo.velocidadeY = -12;
                cubo.noChao = false;
            }
        }

        // Controles de Teclado (Espaço ou Seta para Cima)
        document.addEventListener("keydown", function(evento) {
            if (evento.code === "Space" || evento.code === "ArrowUp") {
                evento.preventDefault();
                if (!pressionado) {
                    pular();
                    pressionado = true;
                }
            }
        });

        document.addEventListener("keyup", function(evento) {
            if (evento.code === "Space" || evento.code === "ArrowUp") {
                pressionado = false;
            }
        });

        // Clique/Toque na tela do canvas para pular
        tela.addEventListener("pointerdown", pular);

        function desenhar() {
            ctx.clearRect(0, 0, 800, 300);

            // Desenhar Chão
            ctx.fillStyle = "#26365c";
            ctx.fillRect(0, 255, 800, 45);

            ctx.strokeStyle = "#36e8ff";
            ctx.beginPath();
            ctx.moveTo(0, 255);
            ctx.lineTo(800, 255);
            ctx.stroke();

            if (jogando) {
                // Física do Cubo
                cubo.velocidadeY += 0.6; // Gravidade
                cubo.y += cubo.velocidadeY;

                if (cubo.y + cubo.tamanho >= 255) {
                    cubo.y = 255 - cubo.tamanho;
                    cubo.velocidadeY = 0;
                    cubo.noChao = true;
                }

                // Movimento e Colisão dos Espinhos
                for (const espinho of espinhos) {
                    espinho.x -= velocidade;

                    // Reposicionar espinho quando sai da tela
                    if (espinho.x + espinho.tamanho < 0) {
                        espinho.x = 800 + Math.random() * 200;
                        pontos++;
                        velocidade += 0.15;
                    }

                    // Detecção de Colisão
                    const bateu =
                        cubo.x + cubo.tamanho > espinho.x &&
                        cubo.x < espinho.x + espinho.tamanho &&
                        cubo.y + cubo.tamanho > 255 - espinho.tamanho;

                    if (bateu) {
                        jogando = false;
                        terminou = true;
                        botao.textContent = "Jogar novamente";
                        informacao.textContent = "Fim de jogo! Pontuação: " + pontos;
                    }
                }
            }

            // Desenhar o cubo
            ctx.fillStyle = "#36e8ff";
            ctx.shadowColor = "#36e8ff";
            ctx.shadowBlur = 15;
            ctx.fillRect(cubo.x, cubo.y, cubo.tamanho, cubo.tamanho);
            ctx.shadowBlur = 0;

            // Desenhar os espinhos
            ctx.fillStyle = "#ff3978";
            for (const espinho of espinhos) {
                ctx.beginPath();
                ctx.moveTo(espinho.x, 255);
                ctx.lineTo(
                    espinho.x + espinho.tamanho / 2,
                    255 - espinho.tamanho
                );
                ctx.lineTo(espinho.x + espinho.tamanho, 255);
                ctx.closePath();
                ctx.fill();
            }

            if (jogando) {
                informacao.textContent = "Pontos: " + pontos;
                frame = requestAnimationFrame(desenhar);
            } else if (terminou) {
                ctx.fillStyle = "white";
                ctx.font = "bold 28px Arial";
                ctx.fillText("FIM DE JOGO!", 290, 120);
            }
        }

        // Desenhar Tela Inicial estática
        ctx.fillStyle = "#26365c";
        ctx.fillRect(0, 255, 800, 45);
        ctx.fillStyle = "#36e8ff";
        ctx.fillRect(100, 225, 30, 30);
        ctx.fillStyle = "#ff3978";
        ctx.beginPath();
        ctx.moveTo(500, 255);
        ctx.lineTo(516, 223);
        ctx.lineTo(532, 255);
        ctx.fill();
    </script>
</body>
</html>
